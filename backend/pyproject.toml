[project]
name = "proeduvate-backend"
version = "0.1.0"
description = "Content API for the ProEduvate marketing site"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "alembic>=1.14",
  "python-dotenv>=1.0",
  "bcrypt>=4.2",
  "pyjwt>=2.10",
  "python-multipart>=0.0.20",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.pytest.ini_options]
pythonpath = ["."]
